name: CI Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main"]

jobs:

  backend:
    name: Backend CI (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do backend + ferramentas de desenvolvimento
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt          

      - name: Debug versões instaladas
        run: |
          cd backend
          echo "isort: $(isort --version-number)"
          echo "black: $(black --version)"
          echo "flake8: $(flake8 --version)"
          echo "pytest: $(pytest --version)"


      # FORMATTERS
      - name: Verificar formatação com Black
        run: |
          cd backend
          black --check .

      - name: Verificar organização de imports com isort
        run: |
          cd backend
          isort . --check-only --profile black

      # LINTER
      - name: Linter (flake8)
        run: |
          cd backend
          flake8 app

      # TESTES
      - name: Rodar testes (pytest)
        run: |
          cd backend
          pytest -v tests
          echo "✅ Testes concluídos com sucesso!"

      # BUILD CHECK PYTHON
      - name: Verificar erros de sintaxe Python
        run: |
          cd backend
          echo "🔍 Verificando arquivos Python..."
          for file in $(find . -name "*.py"); do
            python -m py_compile "$file";
          done

      # DOCKERFILE
      - name: Validar Dockerfile do backend
        run: |
          docker build -t backend-ci-test ./backend



  frontend:
    name: Frontend CI (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        run: |
          cd frontend
          npm ci

      - name: Verificar formatação com Prettier
        run: |
          cd frontend
          npm run format:check --if-present

      - name: Linter (ESLint)
        run: |
          cd frontend
          npm run lint --if-present

      - name: Rodar testes (Node.js)
        run: |
          cd frontend
          npm test

      - name: Build de validação (Vite)
        run: |
          cd frontend
          npm run build

      - name: Validar Dockerfile do frontend
        run: |
          docker build -t frontend-ci-test ./frontend

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Analisar com SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
